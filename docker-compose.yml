services:
  postgres:
    image: postgres:16
    container_name: dcfly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dcfly
      POSTGRES_USER: dcfly
      POSTGRES_PASSWORD: dcfly_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dcfly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcfly -d dcfly"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dcfly-postgres-data:
